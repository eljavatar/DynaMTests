[pytest]
testpaths = tests
addopts = -ra -m "not slow"
markers =
    unit: pure unit tests over a single function or module
    integration: collaboration of two or more pipeline stages over a temporary tree
    e2e: mini-pipeline (dedup -> corpus -> CSV)
    slow: tests expected to take more than one second
    xfail_spoon: desired behaviour after the Spoon migration (strict xfail)
    regression: pins a deliberately imperfect current behaviour
filterwarnings =
    error::DeprecationWarning:pandas.*
    ignore::DeprecationWarning:tqdm.*
